<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>치팅 파인더</title>
    <meta name="description" content="실제로 보도된 시험 부정행위 수법을 모은 도감과, 수상한 행동을 반복하는 응시자를 찾아내는 시험장 미니게임입니다." />
    <meta property="og:title" content="치팅 파인더" />
    <meta property="og:description" content="이런 수법도 있구나, 이렇게 알아챌 수 있구나. 부정행위 수법 도감과 시험장 미니게임." />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="/site.css" />
    <style>
      .hero { text-align: center; }
      .hero h1 { margin: 8px 0 12px; font-size: 2rem; letter-spacing: -0.02em; }
      .hero p { margin: 0 0 6px; }
      .sprites { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
      .sprites img { width: 88px; height: 88px; object-fit: contain; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
      .actions { display: grid; gap: 12px; margin-top: 24px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero card">
        <h1>치팅 파인더</h1>
        <p>실제로 보도된 시험 부정행위 수법을 모아 둔 도감입니다.</p>
        <p>시험장에서 같은 행동을 반복하는 응시자를 찾아내며 알아채는 눈을 길러 보세요.</p>
        <div class="sprites" aria-hidden="true">
          <img class="px" src="/px/smart-glasses-frame-0.webp" alt="" />
          <img class="px" src="/px/analog-watch-0.webp" alt="" />
          <img class="px" src="/px/look-up-0.webp" alt="" />
        </div>
        <nav class="actions">
          <a class="btn btn-primary" href="/dex">도감 보기</a>
          <a class="btn" href="/play">게임 시작</a>
        </nav>
      </section>
      <p class="disclaimer">뉴스 보도 기준 개요이며 따라 하기 안내가 아닙니다. 수사 중인 사건은 바뀔 수 있습니다.</p>
    </main>
  </body>
</html>
